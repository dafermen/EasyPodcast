name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r backend/requirements.lock && python -m pip install -e backend --no-deps
      - run: python scripts/doctor.py
      - run: python -m pytest backend/tests -q
      - run: python -m ruff check backend/app backend/tests --config backend/pyproject.toml
      - run: npm ci && npm test
        working-directory: transcription
      - run: npm ci && npm test && npm run format:check && npm run build
        working-directory: frontend
